spring:
  flyway:
    clean-disabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        default_batch_fetch_size: 100
    database-platform: org.hibernate.dialect.PostgreSQLDialect

---
spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: false
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:core;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: local,dev
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATASOURCE_DB_CORE_JDBC_URL:jdbc:postgresql://localhost:5432/content}
    username: ${DATASOURCE_DB_CORE_USERNAME:content}
    password: ${DATASOURCE_DB_CORE_PASSWORD:content!@}

  jpa:
    hibernate:
      ddl-auto: validate
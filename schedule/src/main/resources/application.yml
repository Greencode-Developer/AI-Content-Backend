spring:
  application:
    name: schedule
  config:
    import:
      - datasource.yml
      - sqs.yml
  main:
    web-application-type: none
  flyway:
    enabled: false

schedule:
  collect:
    cron: ${COLLECT_CRON:0 0 */6 * * *}
#    cron: "0 */1 * * * *"
    lock-at-least-for: ${COLLECT_LOCK_AT_LEAST_FOR:PT5M}
    lock-at-most-for: ${COLLECT_LOCK_AT_MOST_FOR:PT10M}
  ai-job-timeout:
    cron: ${AI_JOB_TIMEOUT_CRON:0 */5 * * * *}
    stuck-after: ${AI_JOB_STUCK_AFTER:PT30M}
    lock-at-least-for: PT1M
    lock-at-most-for: PT4M

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'  apply false
    id 'io.spring.dependency-management' version '1.1.3' apply false
}

group = 'com.web_spring'
version = '1.0-SNAPSHOT'


// Common configuration for all subprojects
subprojects {
    // Apply java-library plugin for library modules, java plugin for application modules
    if (project.path.startsWith(':core-api')) {
        apply plugin: 'java'
    } else {
        apply plugin: 'java-library'
    }

    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    group = 'com.web_spring'
    version = '1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }

    // Common dependencies for ALL modules
    dependencies {
        // Lombok
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        // Testing
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    // disable bootJar (enabled only in application modules)
    tasks.named('bootJar') {
        enabled = false
    }

    // Enable plain jar for libraries
    tasks.named('jar') {
        enabled = true
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

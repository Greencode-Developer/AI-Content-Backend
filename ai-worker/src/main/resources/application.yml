spring:
  config:
    import:
      - datasource.yml
  main:
    web-application-type: none
  flyway:
    enabled: false
  cloud:
    aws:
      region:
        static: ap-southeast-1

      credentials:
        access-key: test
        secret-key: test

      sqs:
        endpoint: http://localhost:4566

ai:
  python:
    base-url: ${AI_PYTHON_BASE_URL:http://localhost:8080}
  idea:
    base-url: ${AI_IDEA_BASE_URL:http://localhost:8000}
    provider: ${AI_IDEA_PROVIDER:bedrock}
    connect-timeout: 5s
    read-timeout: 90s
    # PROCESSING longer than this = worker died, the job can be claimed again (keep > read-timeout)
    processing-timeout: ${AI_IDEA_PROCESSING_TIMEOUT:5m}
  collect:
    post-limit: ${AI_COLLECT_POST_LIMIT:50}

app:
  sqs:
    trend-signal-collect-queue: ${TREND_SIGNAL_COLLECT_QUEUE:trend-signal-collect}
    ai-content-job-queue: ${AI_CONTENT_JOB_QUEUE:ai-content-job}
    dlq:
      provision: ${SQS_DLQ_PROVISION:true}
      suffix: -dlq
      max-receive-count: ${SQS_DLQ_MAX_RECEIVE_COUNT:5}
      retention-seconds: 1209600 # 14 days
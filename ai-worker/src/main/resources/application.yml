spring:
  config:
    import:
      - datasource.yml
  main:
    web-application-type: none
  flyway:
    enabled: false
  cloud:
    aws:
      region:
        static: ap-southeast-1

      credentials:
        access-key: test
        secret-key: test

      sqs:
        endpoint: http://localhost:4566

ai:
  python:
    base-url: ${AI_PYTHON_BASE_URL:http://localhost:8080}
  collect:
    post-limit: ${AI_COLLECT_POST_LIMIT:50}

app:
  sqs:
    trend-signal-collect-queue: ${TREND_SIGNAL_COLLECT_QUEUE:trend-signal-collect}
services:
  content-db:
    image: postgis/postgis:16-3.4
    container_name: content-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    command: [ "postgres", "-c", "log_statement=all" ]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - content-network

  content-floci:
    image: floci/floci:latest
    container_name: content-floci
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      FLOCI_DEFAULT_REGION: ap-southeast-1
    volumes:
      - floci_data:/app/data
    networks:
      - content-network

#  TODO: Redis, etc.

networks:
  content-network:
    driver: bridge

volumes:
  postgres_data:
  floci_data:
